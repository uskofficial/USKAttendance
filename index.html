<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Attendance PRO - ระบบเช็คชื่อแบบทางการ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Face API (AI Model) -->
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
    <!-- SheetJS (สำหรับ Export Excel) -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>

    <style>
        body { font-family: 'Sarabun', sans-serif; }
        .section-view { display: none; }
        .section-view.active { display: block; }
        .camera-box { position: relative; width: 100%; max-width: 640px; margin: 0 auto; background: #000; border-radius: 0.5rem; overflow: hidden; }
        video { width: 100%; transform: scaleX(-1); }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); }
        .spinner { border: 4px solid rgba(255, 255, 255, 0.3); border-radius: 50%; border-top: 4px solid #fff; width: 24px; height: 24px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-100 text-gray-800 h-screen overflow-hidden flex flex-col">

    <!-- 1. หน้าจอ Login -->
    <div id="auth-view" class="fixed inset-0 bg-slate-900 flex items-center justify-center z-50">
        <div class="bg-white p-10 rounded-xl shadow-2xl w-full max-w-md">
            <div class="text-center mb-8">
                <div class="bg-blue-600 text-white w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl shadow-lg">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-800">ระบบเช็คชื่ออัจฉริยะ</h2>
                <p class="text-gray-500 mt-1">เข้าสู่ระบบสำหรับเจ้าหน้าที่</p>
            </div>
            <form id="login-form" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">อีเมลผู้ดูแลระบบ</label>
                    <input type="email" id="login-email" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="admin@school.com">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">รหัสผ่าน</label>
                    <input type="password" id="login-pass" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="••••••••">
                </div>
                <button type="submit" id="login-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white p-3 rounded-lg font-bold shadow-md transition">เข้าสู่ระบบ</button>
                <p id="login-msg" class="text-sm mt-3 text-center text-red-500 font-medium"></p>
            </form>
        </div>
    </div>

    <!-- 2. ระบบหลัก (Dashboard) -->
    <div id="app-view" class="hidden h-full flex w-full">
        <!-- Sidebar -->
        <aside class="w-64 bg-slate-800 text-white flex flex-col shadow-xl z-10 shrink-0">
            <div class="p-6 border-b border-slate-700 flex items-center gap-3">
                <i class="fa-solid fa-id-card-clip text-2xl text-blue-400"></i>
                <span class="text-lg font-bold">FaceScan PRO</span>
            </div>
            <nav class="p-4 space-y-2 flex-grow">
                <button onclick="navTo('dashboard')" id="nav-dashboard" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-lg text-left hover:bg-slate-700 transition bg-blue-600">
                    <i class="fa-solid fa-chart-line w-5"></i> สรุปรายงาน
                </button>
                <button onclick="navTo('enroll')" id="nav-enroll" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-lg text-left hover:bg-slate-700 transition">
                    <i class="fa-solid fa-user-plus w-5"></i> ลงทะเบียนฐานข้อมูล
                </button>
                <button onclick="navTo('scanner')" id="nav-scanner" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-lg text-left hover:bg-slate-700 transition">
                    <i class="fa-solid fa-expand w-5"></i> จุดตรวจ (Scanner)
                </button>
            </nav>
            <div class="p-4 border-t border-slate-700">
                <button id="logout-btn" class="w-full bg-red-600 hover:bg-red-700 text-white p-2 rounded-lg text-sm font-semibold transition">ออกจากระบบ</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col h-full overflow-y-auto">
            <div id="status-bar" class="bg-blue-900 text-white p-2 text-center text-sm shadow-md sticky top-0 z-20 flex justify-center items-center gap-2">
                <div class="spinner"></div><span id="status-text">กำลังซิงค์ข้อมูล...</span>
            </div>

            <div class="p-8 w-full max-w-7xl mx-auto">
                
                <!-- A. หน้า Dashboard -->
                <section id="section-dashboard" class="section-view active">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-bold text-slate-800">รายงานการเข้าเรียน</h2>
                        <div class="flex gap-2">
                            <button id="refresh-dashboard" class="bg-white border border-gray-300 px-4 py-2 rounded-lg hover:bg-gray-50 flex items-center gap-2 font-medium shadow-sm">
                                <i class="fa-solid fa-rotate"></i> รีเฟรช
                            </button>
                            <button id="export-excel" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 flex items-center gap-2 font-bold shadow-sm">
                                <i class="fa-solid fa-file-excel"></i> Export Excel
                            </button>
                        </div>
                    </div>
                    
                    <!-- ตารางข้อมูล -->
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-x-auto">
                        <table class="w-full text-left whitespace-nowrap" id="report-table">
                            <thead>
                                <tr class="bg-slate-50 text-slate-600 border-b text-sm">
                                    <th class="p-4">เวลาสแกน</th>
                                    <th class="p-4">สถานะ</th>
                                    <th class="p-4">รหัสนักเรียน</th>
                                    <th class="p-4">ชื่อ - นามสกุล</th>
                                    <th class="p-4">ระดับชั้น/ห้อง/สาขา</th>
                                    <th class="p-4">วิชา/กิจกรรม</th>
                                    <th class="p-4">ช่องทาง</th>
                                </tr>
                            </thead>
                            <tbody id="attendance-table-body" class="text-sm text-slate-700">
                                <tr><td colspan="7" class="text-center p-8 text-gray-500">กำลังโหลด...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </section>

                <!-- B. หน้าลงทะเบียน -->
                <section id="section-enroll" class="section-view">
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <div class="bg-white p-6 rounded-xl shadow-sm border">
                            <h3 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">ข้อมูลพื้นฐานผู้เรียน</h3>
                            <form id="enroll-form" class="space-y-4">
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-sm font-semibold mb-1">รหัสนักเรียน</label>
                                        <input type="text" id="en-id" required class="w-full p-2 border rounded-lg bg-gray-50 outline-none focus:ring-2 focus:ring-blue-500">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-semibold mb-1">ระดับชั้น / ห้อง / คณะ</label>
                                        <input type="text" id="en-class" required placeholder="ม.5/1 หรือ วิศวกรรมศาสตร์" class="w-full p-2 border rounded-lg bg-gray-50 outline-none focus:ring-2 focus:ring-blue-500">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-sm font-semibold mb-1">ชื่อ - นามสกุล</label>
                                    <input type="text" id="en-name" required class="w-full p-2 border rounded-lg bg-gray-50 outline-none focus:ring-2 focus:ring-blue-500">
                                </div>
                                <div>
                                    <label class="block text-sm font-semibold mb-1">ชื่อรายวิชา / กิจกรรม (Default)</label>
                                    <input type="text" id="en-course" required value="โฮมรูมตอนเช้า" class="w-full p-2 border rounded-lg bg-gray-50 outline-none focus:ring-2 focus:ring-blue-500">
                                </div>
                                <div class="pt-4 mt-4 border-t space-y-2">
                                    <button type="button" id="start-enroll-btn" class="w-full bg-slate-800 text-white p-3 rounded-lg font-bold flex justify-center gap-2 hover:bg-slate-900 transition">
                                        <i class="fa-solid fa-camera"></i> 1. เปิดกล้อง
                                    </button>
                                    <button type="submit" id="save-enroll-btn" disabled class="w-full bg-blue-600 text-white p-3 rounded-lg font-bold flex justify-center gap-2 hover:bg-blue-700 disabled:opacity-50 transition">
                                        <i class="fa-solid fa-floppy-disk"></i> 2. ถ่ายภาพและบันทึกข้อมูล
                                    </button>
                                </div>
                                <p id="enroll-msg" class="text-sm text-center font-bold mt-2"></p>
                            </form>
                        </div>
                        <div class="bg-gray-100 p-4 rounded-xl border flex flex-col items-center justify-center min-h-[400px]">
                            <div class="camera-box border-4 border-dashed border-gray-300 w-full aspect-video flex items-center justify-center bg-white" id="enroll-cam-box">
                                <i class="fa-solid fa-user text-5xl text-gray-300" id="en-icon"></i>
                                <video id="en-vid" autoplay muted playsinline class="hidden"></video>
                                <canvas id="en-can" class="hidden"></canvas>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- C. หน้าสแกน -->
                <section id="section-scanner" class="section-view text-center">
                    <h2 class="text-2xl font-bold mb-4">จุดตรวจสแกนใบหน้า Real-time</h2>
                    <div class="bg-white p-4 rounded-xl shadow inline-block border">
                        <div class="mb-4 text-left">
                            <label class="block text-sm font-semibold text-gray-700">รายวิชา/กิจกรรมที่กำลังสแกน:</label>
                            <input type="text" id="scan-subject" value="โฮมรูมตอนเช้า" class="w-full p-2 border rounded focus:ring-2 outline-none font-bold text-blue-700">
                        </div>
                        <div class="camera-box border-4 border-slate-900 bg-black min-w-[320px] sm:min-w-[640px] aspect-video flex items-center justify-center">
                            <video id="scan-vid" autoplay muted playsinline class="hidden"></video>
                            <canvas id="scan-can" class="hidden"></canvas>
                        </div>
                        <div class="mt-4 flex gap-2 justify-center">
                            <button id="start-scan-btn" class="bg-green-600 text-white px-6 py-2 rounded-lg font-bold shadow hover:bg-green-700">เริ่มสแกน</button>
                            <button id="stop-scan-btn" class="bg-red-600 text-white px-6 py-2 rounded-lg font-bold shadow hover:bg-red-700 hidden">หยุดสแกน</button>
                        </div>
                        <div id="scan-result" class="mt-4 p-3 rounded bg-gray-50 border h-16 flex items-center justify-center font-bold text-xl text-gray-400">รอรับภาพ...</div>
                    </div>
                </section>

            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

        // 1. Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyA_sa2vM6b_Tf_D5k4oQD2BAyaNHecU2GQ",
            authDomain: "dimension-a9dca.firebaseapp.com",
            projectId: "dimension-a9dca",
            storageBucket: "dimension-a9dca.firebasestorage.app",
            messagingSenderId: "92180281499",
            appId: "1:92180281499:web:d568811e8c336b14162e3e",
            measurementId: "G-QW4L9GG1VZ"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let faceMatcher = null;
        let activeStream = null;
        let scanInterval = null;
        const cooldown = new Map();
        let studentsData = {}; // เก็บข้อมูลพื้นฐานนักเรียนเพื่อใช้ตอนสแกน

        // 2. Auth Flow
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-view').classList.add('hidden');
                document.getElementById('app-view').classList.remove('hidden');
                initAI();
                navTo('dashboard');
            } else {
                document.getElementById('auth-view').classList.remove('hidden');
                document.getElementById('app-view').classList.add('hidden');
                stopCam();
            }
        });

        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            btn.disabled = true; btn.innerText = "กำลังเข้าสู่ระบบ...";
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('login-email').value, document.getElementById('login-pass').value);
            } catch (err) {
                document.getElementById('login-msg').innerText = "อีเมลหรือรหัสผ่านไม่ถูกต้อง";
            } finally { btn.disabled = false; btn.innerText = "เข้าสู่ระบบ"; }
        };
        document.getElementById('logout-btn').onclick = () => signOut(auth);

        // 3. Navigation
        window.navTo = (sec) => {
            stopCam();
            document.querySelectorAll('.nav-item').forEach(el => { el.classList.remove('bg-blue-600'); el.classList.add('hover:bg-slate-700'); });
            document.getElementById('nav-'+sec).classList.add('bg-blue-600');
            document.querySelectorAll('.section-view').forEach(el => el.classList.remove('active'));
            document.getElementById('section-'+sec).classList.add('active');
            if(sec === 'dashboard') fetchReports();
        };

        // 4. AI & DB Sync (Optimized)
        async function initAI() {
            try {
                const URI = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights';
                await Promise.all([
                    faceapi.nets.tinyFaceDetector.loadFromUri(URI), // ใช้ Tiny เพื่อให้เบา ไม่ค้าง
                    faceapi.nets.faceLandmark68Net.loadFromUri(URI),
                    faceapi.nets.faceRecognitionNet.loadFromUri(URI)
                ]);
                await syncDB();
                document.getElementById('status-bar').classList.replace('bg-blue-900', 'bg-green-600');
                document.getElementById('status-text').innerText = "✅ ข้อมูลและ AI พร้อมทำงาน";
                document.querySelector('.spinner').style.display = 'none';
                setTimeout(() => { document.getElementById('status-bar').style.display = 'none'; }, 3000);
            } catch (e) { alert("โหลด AI ล้มเหลว กรุณารีเฟรช"); }
        }

        async function syncDB() {
            const snap = await getDocs(collection(db, "students"));
            const labels = [];
            studentsData = {};
            snap.forEach(doc => {
                const d = doc.data();
                if(d.descriptor) {
                    labels.push(new faceapi.LabeledFaceDescriptors(d.studentId, [new Float32Array(d.descriptor)]));
                    studentsData[d.studentId] = d;
                }
            });
            faceMatcher = labels.length > 0 ? new faceapi.FaceMatcher(labels, 0.5) : null;
        }

        function stopCam() {
            if(activeStream) activeStream.getTracks().forEach(t => t.stop());
            if(scanInterval) clearInterval(scanInterval);
            document.querySelectorAll('video, canvas').forEach(el => el.classList.add('hidden'));
            document.getElementById('start-scan-btn').classList.remove('hidden');
            document.getElementById('stop-scan-btn').classList.add('hidden');
            document.getElementById('en-icon').classList.remove('hidden');
            document.getElementById('enroll-cam-box').classList.remove('border-green-500');
        }

        // 5. Enrollment
        document.getElementById('start-enroll-btn').onclick = async () => {
            stopCam();
            activeStream = await navigator.mediaDevices.getUserMedia({video: true});
            const v = document.getElementById('en-vid');
            v.srcObject = activeStream;
            v.classList.remove('hidden');
            document.getElementById('en-icon').classList.add('hidden');
            document.getElementById('enroll-cam-box').classList.add('border-green-500');
            document.getElementById('save-enroll-btn').disabled = false;
        };

        document.getElementById('enroll-form').onsubmit = async (e) => {
            e.preventDefault();
            if(!activeStream) return alert("เปิดกล้องก่อน");
            const btn = document.getElementById('save-enroll-btn');
            btn.disabled = true; btn.innerText = "กำลังประมวลผล...";
            
            try {
                const det = await faceapi.detectSingleFace(document.getElementById('en-vid'), new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
                if(!det) throw new Error("ไม่พบหน้า");
                
                await addDoc(collection(db, "students"), {
                    studentId: document.getElementById('en-id').value,
                    name: document.getElementById('en-name').value,
                    level: document.getElementById('en-class').value,
                    course: document.getElementById('en-course').value,
                    descriptor: Array.from(det.descriptor),
                    createdAt: serverTimestamp()
                });
                
                document.getElementById('enroll-msg').innerHTML = `<span class="text-green-600">ลงทะเบียนสำเร็จ!</span>`;
                e.target.reset(); stopCam(); await syncDB();
            } catch (err) {
                document.getElementById('enroll-msg').innerHTML = `<span class="text-red-600">${err.message}</span>`;
            } finally { btn.disabled = false; btn.innerHTML = "2. ถ่ายภาพและบันทึกข้อมูล"; }
        };

        // 6. Scanner (Optimized ลูปประมวลผล)
        const scanVid = document.getElementById('scan-vid');
        const scanCan = document.getElementById('scan-can');
        
        document.getElementById('start-scan-btn').onclick = async () => {
            if(!faceMatcher) return alert("ไม่มีข้อมูล");
            stopCam();
            document.getElementById('start-scan-btn').classList.add('hidden');
            document.getElementById('stop-scan-btn').classList.remove('hidden');
            
            // ลดความละเอียดกล้องลง เพื่อไม่ให้ Browser ค้าง
            activeStream = await navigator.mediaDevices.getUserMedia({video: {width: 480}});
            scanVid.srcObject = activeStream;
            scanVid.classList.remove('hidden');
            scanCan.classList.remove('hidden');
        };
        document.getElementById('stop-scan-btn').onclick = stopCam;

        scanVid.onplay = () => {
            faceapi.matchDimensions(scanCan, scanVid);
            
            // ใช้ 1000ms (1 วินาที) แทน 400ms เพื่อป้องกันการค้าง
            scanInterval = setInterval(async () => {
                const dets = await faceapi.detectAllFaces(scanVid, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptors();
                const resDets = faceapi.resizeResults(dets, scanVid);
                
                const ctx = scanCan.getContext('2d');
                ctx.clearRect(0,0,scanCan.width,scanCan.height);
                
                for(const d of resDets) {
                    const match = faceMatcher.findBestMatch(d.descriptor);
                    if(match.label !== 'unknown') {
                        const sid = match.label;
                        const student = studentsData[sid];
                        const now = Date.now();
                        
                        new faceapi.draw.DrawBox(d.detection.box, {label: student.name, boxColor: '#16a34a'}).draw(scanCan);
                        
                        if(now - (cooldown.get(sid) || 0) > 60000) {
                            cooldown.set(sid, now);
                            
                            // โลจิกเช็คมาสาย (หลัง 08:00 ถือว่าสาย)
                            const currentHour = new Date().getHours();
                            const currentMin = new Date().getMinutes();
                            const status = (currentHour > 8 || (currentHour === 8 && currentMin > 0)) ? "มาสาย" : "มาปกติ";
                            const subject = document.getElementById('scan-subject').value;
                            
                            document.getElementById('scan-result').innerHTML = `<span class="text-green-600 font-bold">${student.name} - ${status}</span>`;
                            
                            addDoc(collection(db, "attendance"), {
                                studentId: sid,
                                name: student.name,
                                level: student.level,
                                course: subject,
                                status: status,
                                method: "Face Scan",
                                timestamp: serverTimestamp()
                            });
                        }
                    } else {
                        new faceapi.draw.DrawBox(d.detection.box, {label: "Unknown", boxColor: '#ef4444'}).draw(scanCan);
                    }
                }
            }, 1000); 
        };

        // 7. Dashboard & Export
        async function fetchReports() {
            const tb = document.getElementById('attendance-table-body');
            tb.innerHTML = '<tr><td colspan="7" class="text-center p-8">กำลังโหลด...</td></tr>';
            try {
                const q = query(collection(db, "attendance"), orderBy("timestamp", "desc"), limit(200));
                const snap = await getDocs(q);
                tb.innerHTML = snap.empty ? '<tr><td colspan="7" class="text-center p-8">ไม่มีข้อมูล</td></tr>' : '';
                
                snap.forEach(doc => {
                    const d = doc.data();
                    const time = d.timestamp ? d.timestamp.toDate().toLocaleString('th-TH') : "-";
                    const statusColor = d.status === 'มาสาย' ? 'text-amber-600 bg-amber-50' : 'text-green-600 bg-green-50';
                    
                    tb.innerHTML += `
                        <tr class="border-b hover:bg-gray-50">
                            <td class="p-4">${time}</td>
                            <td class="p-4"><span class="px-2 py-1 rounded-full text-xs font-bold ${statusColor}">${d.status}</span></td>
                            <td class="p-4 font-bold text-gray-700">${d.studentId}</td>
                            <td class="p-4">${d.name}</td>
                            <td class="p-4">${d.level || '-'}</td>
                            <td class="p-4">${d.course || '-'}</td>
                            <td class="p-4"><i class="fa-solid fa-camera mr-1 text-gray-400"></i> ${d.method || 'Face Scan'}</td>
                        </tr>
                    `;
                });
            } catch(e) { tb.innerHTML = `<tr><td colspan="7" class="text-center p-8 text-red-500">Error: ${e.message}</td></tr>`; }
        }
        document.getElementById('refresh-dashboard').onclick = fetchReports;

        // Export to Excel using SheetJS
        document.getElementById('export-excel').onclick = () => {
            const table = document.getElementById("report-table");
            const wb = XLSX.utils.table_to_book(table, {sheet: "รายงานเข้าเรียน"});
            XLSX.writeFile(wb, "Attendance_Report.xlsx");
        };
    </script>
</body>
</html>
